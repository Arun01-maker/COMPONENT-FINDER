<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Component Finder</h1>
        
        <div class="flex gap-4 mb-8">
            <input id="searchInput" type="text" value="78L10" placeholder="Enter part name..." 
                   class="flex-1 p-3 rounded bg-slate-800 text-white border border-slate-700 focus:outline-none focus:border-blue-500">
            <button id="searchBtn" onclick="startSearch()" class="bg-blue-600 px-6 py-3 rounded font-bold hover:bg-blue-500">
                Search Parts →
            </button>
        </div>

        <div id="statusBox" class="p-4 mb-6 rounded bg-slate-800 border border-slate-700 text-yellow-400 hidden">
            <span id="statusText">Querying distributors...</span>
        </div>

        <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        async function startSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const container = document.getElementById('resultsContainer');
            const searchBtn = document.getElementById('searchBtn');

            container.innerHTML = '';
            statusBox.classList.remove('hidden', 'text-red-400', 'text-green-400');
            statusBox.classList.add('text-yellow-400');
            statusText.textContent = `Querying distributors for "${query}"...`;
            searchBtn.disabled = true;

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    statusText.textContent = `Found ${data.results.length} result(s)!`;
                    statusBox.classList.remove('text-yellow-400');
                    statusBox.classList.add('text-green-400');
                    renderResults(data.results);
                } else {
                    statusText.textContent = "No products found for this query.";
                }
            } catch (err) {
                console.error("Search fetch failed:", err);
                statusText.textContent = `Error: ${err.message}. Please try again.`;
                statusBox.classList.remove('text-yellow-400');
                statusBox.classList.add('text-red-400');
            } finally {
                searchBtn.disabled = false;
            }
        }

        function renderResults(products) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = products.map(item => `
                <div class="bg-slate-800 p-4 rounded border border-slate-700 flex flex-col justify-between">
                    <div>
                        <span class="text-xs font-bold px-2 py-1 rounded bg-blue-900 text-blue-300 mb-2 inline-block">
                            ${item.distributor}
                        </span>
                        <h3 class="font-semibold text-lg">${item.title}</h3>
                        <p class="text-xl font-bold text-green-400 mt-2">${item.price}</p>
                    </div>
                    <a href="${item.link}" target="_blank" class="mt-4 text-center bg-blue-600 hover:bg-blue-500 py-2 rounded text-sm font-semibold text-white">
                        View Product →
                    </a>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
