<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Finder</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f1715; color: #e2e8f0; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; }
    button { padding: 12px 24px; border: none; border-radius: 6px; background: #e07a5f; color: #fff; cursor: pointer; font-weight: bold; }
    .status { color: #34d399; margin-bottom: 20px; font-size: 14px; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card { background: #1e293b; padding: 16px; border-radius: 8px; border: 1px solid #334155; }
    .card h4 { margin: 0 0 8px 0; font-size: 16px; color: #f8fafc; }
    .card .price { color: #34d399; font-weight: bold; margin-bottom: 8px; }
    .card a { display: inline-block; color: #38bdf8; text-decoration: none; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Component Finder</h1>
  <div class="search-box">
    <input type="text" id="queryInput" placeholder="Enter component name (e.g. LM2596)...">
    <button onclick="startSearch()">Search</button>
  </div>

  <div id="statusText" class="status"></div>
  <div id="results" class="results-grid"></div>
</div>

<script>
let evtSource = null;

function startSearch() {
  const query = document.getElementById('queryInput').value.trim();
  const resultsDiv = document.getElementById('results');
  const statusDiv = document.getElementById('statusText');

  if (!query) return;

  resultsDiv.innerHTML = '';
  statusDiv.textContent = '● Connecting to search server...';

  if (evtSource) {
    evtSource.close();
  }

  // Connect directly to your live Render instance endpoint
  const backendUrl = `https://component-finder.onrender.com/api/search?q=${encodeURIComponent(query)}`;
  evtSource = new EventSource(backendUrl);

  evtSource.onmessage = function(event) {
    const data = JSON.parse(event.data);

    if (data.type === 'meta') {
      statusDiv.textContent = `● Searching across distributors...`;
    } 
    else if (data.type === 'result') {
      if (data.products && data.products.length > 0) {
        data.products.forEach(product => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h4>${product.title}</h4>
            <div class="price">${product.price}</div>
            <div style="font-size: 12px; color: #94a3b8;">Source: ${data.site}</div>
            <a href="${product.link}" target="_blank">View Item &rarr;</a>
          `;
          resultsDiv.appendChild(card);
        });
      }
    } 
    else if (data.type === 'done') {
      statusDiv.textContent = '● Search completed!';
      evtSource.close();
    }
  };

  evtSource.onerror = function(err) {
    statusDiv.textContent = '● Search connection ended or timed out.';
    evtSource.close();
  };
}
</script>

</body>
</html>
