<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Finder India</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --success-bg: #064e3b;
      --success-text: #34d399;
      --danger-bg: #450a0a;
      --danger-text: #f87171;
      --warning-bg: #7c2d12;
      --warning-text: #fb923c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header & Title */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Search Bar UI */
    .search-container {
      display: flex;
      gap: 12px;
      max-width: 650px;
      margin: 0 auto 32px auto;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    button.search-btn {
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.search-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Status Grid UI */
    .status-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 32px;
      display: none;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .status-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .site-card {
      background: #0d1117;
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-pending { background: #21262d; color: var(--text-muted); }
    .badge-searching { background: var(--warning-bg); color: var(--warning-text); animation: pulse 1.2s infinite; }
    .badge-available { background: var(--success-bg); color: var(--success-text); }
    .badge-unavailable { background: var(--danger-bg); color: var(--danger-text); }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    /* Controls & Filter Bar (UX Improvement) */
    .controls-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .results-count {
      font-size: 14px;
      color: var(--text-muted);
    }

    .filter-group {
      display: flex;
      gap: 10px;
    }

    select.control-select {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    /* Product Grid UI */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, border-color 0.15s;
    }

    .product-card:hover {
      transform: translateY(-2px);
      border-color: #484f58;
    }

    .product-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-meta {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--success-text);
      margin-bottom: 4px;
    }

    .product-vendor {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .product-link {
      display: block;
      text-align: center;
      padding: 10px;
      background: #21262d;
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .product-link:hover {
      background: #30363d;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Component Finder</h1>
    <p>Search Indian electronics distributors in real-time</p>
  </header>

  <div class="search-container">
    <div class="search-input-wrapper">
      <input type="text" id="queryInput" placeholder="Search for components (e.g. LM2596, ESP32, STM32)..." onkeydown="if(event.key === 'Enter') startSearch()">
    </div>
    <button class="search-btn" onclick="startSearch()">Search</button>
  </div>

  <!-- Status Checklist Panel -->
  <div id="statusPanel" class="status-panel">
    <div class="status-header">
      <span class="status-title">Distributor Checking Status</span>
    </div>
    <div id="statusGrid" class="status-grid"></div>
  </div>

  <!-- Filter & Sort Controls -->
  <div id="controlsBar" class="controls-bar">
    <div id="resultsCount" class="results-count">0 components found</div>
    <div class="filter-group">
      <select id="sortSelect" class="control-select" onchange="renderProducts()">
        <option value="default">Sort: Default</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
      </select>
    </div>
  </div>

  <!-- Results Grid -->
  <div id="results" class="results-grid"></div>
</div>

<script>
let evtSource = null;
let allProducts = [];

function makeId(name) {
  return 'site-' + name.replace(/[^a-zA-Z0-9]/g, '');
}

function parsePrice(priceStr) {
  if (!priceStr) return 0;
  const num = priceStr.replace(/[^0-9.]/g, '');
  return parseFloat(num) || 0;
}

function startSearch() {
  const query = document.getElementById('queryInput').value.trim();
  const resultsDiv = document.getElementById('results');
  const statusPanel = document.getElementById('statusPanel');
  const statusGrid = document.getElementById('statusGrid');
  const controlsBar = document.getElementById('controlsBar');

  if (!query) return;

  allProducts = [];
  resultsDiv.innerHTML = '';
  statusGrid.innerHTML = '';
  statusPanel.style.display = 'block';
  controlsBar.style.display = 'none';

  if (evtSource) {
    evtSource.close();
  }

  const backendUrl = `https://component-finder.onrender.com/api/search?q=${encodeURIComponent(query)}`;
  evtSource = new EventSource(backendUrl);

  evtSource.onmessage = function(event) {
    const data = JSON.parse(event.data);

    if (data.type === 'init') {
      data.sites.forEach(siteName => {
        const id = makeId(siteName);
        const item = document.createElement('div');
        item.className = 'site-card';
        item.id = id;
        item.innerHTML = `
          <span>${siteName}</span>
          <span class="badge badge-pending">Pending</span>
        `;
        statusGrid.appendChild(item);
      });
    } 
    else if (data.type === 'status') {
      const id = makeId(data.site);
      const card = document.getElementById(id);
      if (card) {
        if (data.state === 'searching') {
          card.querySelector('.badge').className = 'badge badge-searching';
          card.querySelector('.badge').textContent = 'Searching...';
        } else if (data.state === 'done') {
          if (data.count > 0) {
            card.querySelector('.badge').className = 'badge badge-available';
            card.querySelector('.badge').textContent = `Available (${data.count})`;
          } else {
            card.querySelector('.badge').className = 'badge badge-unavailable';
            card.querySelector('.badge').textContent = 'Not Available';
          }
        }
      }
    }
    else if (data.type === 'result') {
      if (data.products && data.products.length > 0) {
        data.products.forEach(p => {
          allProducts.push({ ...p, site: data.site, parsedPrice: parsePrice(p.price) });
        });
        controlsBar.style.display = 'flex';
        renderProducts();
      }
    } 
    else if (data.type === 'done') {
      evtSource.close();
    }
  };

  evtSource.onerror = function() {
    evtSource.close();
  };
}

function renderProducts() {
  const resultsDiv = document.getElementById('results');
  const resultsCount = document.getElementById('resultsCount');
  const sortValue = document.getElementById('sortSelect').value;

  let displayProducts = [...allProducts];

  if (sortValue === 'price-low') {
    displayProducts.sort((a, b) => a.parsedPrice - b.parsedPrice);
  } else if (sortValue === 'price-high') {
    displayProducts.sort((a, b) => b.parsedPrice - a.parsedPrice);
  }

  resultsCount.textContent = `${displayProducts.length} components found`;
  resultsDiv.innerHTML = '';

  displayProducts.forEach(product => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div>
        <div class="product-title">${product.title}</div>
      </div>
      <div class="product-meta">
        <div class="product-price">${product.price}</div>
        <div class="product-vendor">Vendor: ${product.site}</div>
        <a href="${product.link}" target="_blank" class="product-link">View Details &rarr;</a>
      </div>
    `;
    resultsDiv.appendChild(card);
  });
}
</script>

</body>
</html>
